services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      APP_ENV: compose
    depends_on:
      redis:
        condition: service_healthy
